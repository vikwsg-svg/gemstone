# Alembic config for the enterprise tables only.
#   ENTERPRISE_DATABASE_URL=postgresql://... alembic -c enterprise/alembic.ini upgrade head
# Uses its own version table (ent_alembic_version) so it never collides with the
# main backend's migrations when both share one Postgres database.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
